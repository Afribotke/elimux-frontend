name: CI

# Frontend CI for this repository (the repo root IS the frontend; there are no
# elimux-frontend/ or elimux-backend/ subfolders). Runs only checks that work
# without any secrets or network services:
#   - typecheck  (tsc --noEmit)
#   - unit tests (npm run test:unit: tsc-compiled node:test suite, in-memory fakes)
#
# Deliberately NOT here (yet):
#   - deployment (Vercel's Git integration deploys; deploy.yml is disabled)
#   - lint (no ESLint config in the repo; `next lint` would prompt)
#   - build / E2E (they need environment values; the previous workflow passed
#     repository secrets into PR jobs - this one uses NO secrets at all)
#
# Node 22: @supabase/supabase-js and @supabase/auth-js declare engines node >= 22.

on:
  pull_request:          # every PR, including stacked PRs whose base is not main
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read         # read-only token; this workflow writes nothing

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck + unit tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit
